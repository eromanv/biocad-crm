services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biocad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biocad}
      POSTGRES_DB: ${POSTGRES_DB:-biocad}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biocad} -d ${POSTGRES_DB:-biocad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://biocad:biocad@db:5432/biocad}
      MCP_URL: ${MCP_URL:-http://mcp:8101/mcp}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      CHAT_MAX_ROUNDS: ${CHAT_MAX_ROUNDS:-5}
      CHAT_MAX_INPUT_LEN: ${CHAT_MAX_INPUT_LEN:-500}
      CHAT_MAX_RESPONSE_LEN: ${CHAT_MAX_RESPONSE_LEN:-2000}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10}
      CHAT_SESSION_TTL: ${CHAT_SESSION_TTL:-1800}
      CHAT_COOKIE_SECURE: ${CHAT_COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages/plan-core:/app/packages/plan-core
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    ports:
      - "${MCP_PORT:-8101}:8101"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://biocad:biocad@db:5432/biocad}
    volumes:
      - ./apps/mcp:/app/apps/mcp
      - ./packages/plan-core:/app/packages/plan-core
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8101", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5174}:5174"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
      VITE_PROXY_TARGET: http://backend:8001
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
