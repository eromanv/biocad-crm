[project]
name = "plan-core"
version = "0.2.2"
description = "Shared Biocad plan domain: models, CPM, Excel, Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plan_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
