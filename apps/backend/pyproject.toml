[project]
name = "biocad-backend"
version = "0.2.1"
description = "Biocad FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "plan-core",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "openai==1.59.6",
  "httpx==0.28.1",
  "mcp[cli]==1.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0"]

[tool.uv]
package = false

[tool.uv.sources]
plan-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
