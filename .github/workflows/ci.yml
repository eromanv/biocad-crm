name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          uvx ruff check apps/backend apps/mcp packages/plan-core
          uvx ruff format --check apps/backend apps/mcp packages/plan-core

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Frontend typecheck
        working-directory: apps/frontend
        run: |
          bun install --frozen-lockfile
          bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Pytest plan-core
        run: uv run --frozen --package plan-core --extra dev pytest -q
        working-directory: packages/plan-core

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Remote default shell is often dash; --noprofile/--norc avoids PS1 + set -u.
          script: |
            bash --noprofile --norc -euo pipefail -c '
              cd "${{ secrets.DEPLOY_PATH }}"
              test -d .git
              test -f .env
              git fetch origin master
              git reset --hard origin/master
              docker compose -f docker-compose.prod.yml --env-file .env up --build -d
              docker compose -f docker-compose.prod.yml --env-file .env ps
            '